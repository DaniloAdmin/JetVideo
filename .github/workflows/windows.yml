name: Windows release candidate
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14.10'
      - name: Install requirements
        run: python -m pip install -r requirements-build.lock
      - run: python -m pytest -q
      - run: python release_security.py
      - name: Build standalone EXE
        shell: cmd
        run: >-
          python -m PyInstaller --noconfirm --clean JetVideo.spec
      - name: Empty settings smoke check
        shell: pwsh
        timeout-minutes: 3
        run: |
          $report = 'verification/frozen-smoke.json'
          $p = Start-Process -FilePath '.\dist\JetVideo.exe' -ArgumentList "--smoke-test $report" -Wait -PassThru
          if ($p.ExitCode -ne 0) {
            $errorReport = [IO.Path]::ChangeExtension($report, '.error.txt')
            if (Test-Path -LiteralPath $errorReport) {
              Get-Content -Raw -Encoding utf8 -LiteralPath $errorReport
            }
            throw "Smoke check failed with exit code $($p.ExitCode)"
          }
          if (-not (Get-Content -Raw -Encoding utf8 -LiteralPath $report | ConvertFrom-Json).ok) { throw 'No successful smoke report' }
      - uses: actions/upload-artifact@v4
        with:
          name: JetVideo-Windows-x64
          path: |
            dist/JetVideo.exe
            THIRD_PARTY_NOTICES.md
            third_party/
            verification/frozen-smoke.json
          retention-days: 30
